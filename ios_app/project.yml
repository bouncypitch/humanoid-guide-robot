name: RGBDCapture
options:
  bundleIdPrefix: com.kdotmahesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RGBDCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RGBDCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdotmahesh.rgbdcapture
        PRODUCT_NAME: RGBDCapture
        INFOPLIST_KEY_CFBundleDisplayName: "RGBD Capture"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: RGBDCapture/Info.plist
      properties:
        CFBundleDisplayName: "RGBD Capture"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "RGBD Capture uses the camera and LiDAR to record a color + depth walkthrough of your space."
        NSLocalNetworkUsageDescription: "RGBD Capture streams the recording live to your Mac on the local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: false
  RGBDCaptureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RGBDCaptureTests
      - path: RGBDCapture/CaptureMath.swift
      - path: RGBDCapture/ImageEncoding.swift
      - path: RGBDCapture/SessionZipper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdotmahesh.rgbdcapture.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RGBDCapture:
    build:
      targets:
        RGBDCapture: all
    test:
      targets:
        - RGBDCaptureTests
